# Example for the existing HOST Nginx. Review paths and install manually.
# Define this zone once in the http context, outside server{}:
limit_req_zone $binary_remote_addr zone=mama_api:10m rate=10r/s;
server {
    listen 80;
    server_name mama.neyrix-ai.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name mama.neyrix-ai.ru;
    ssl_certificate /etc/letsencrypt/live/mama.neyrix-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mama.neyrix-ai.ru/privkey.pem;
    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Do not write patient paths, tokens or request bodies to shared access logs.
    access_log off;
    location ^~ /api/internal/ { return 404; }
    location = /telegram/webhook {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Bot-Secret "";
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=mama_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Bot-Secret "";
        proxy_set_header X-Telegram-Id "";
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Bot-Secret "";
        proxy_http_version 1.1;
    }
}
