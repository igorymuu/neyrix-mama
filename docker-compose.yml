name: neyrix-mama
x-backend: &backend
  build: ./backend
  env_file: .env
  restart: unless-stopped
  networks: [mama]
  volumes: [medical_files:/data/files]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mama
      POSTGRES_USER: mama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [mama]
    restart: unless-stopped
    mem_limit: 384m
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mama -d mama']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [mama]
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    restart: 'no'
    command: [sh, -c, 'alembic upgrade head && python -m app.seed']
    mem_limit: 384m
  backend:
    <<: *backend
    ports: ['127.0.0.1:${BACKEND_PORT:-8100}:8000']
    mem_limit: 384m
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    mem_limit: 512m
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "from app.security import redis_client; assert redis_client().exists('mama:worker:heartbeat')"]
      interval: 30s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports: ['127.0.0.1:${FRONTEND_PORT:-3100}:3000']
    networks: [mama]
    restart: unless-stopped
    mem_limit: 384m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
  bot:
    build: ./bot
    env_file: .env
    ports: ['127.0.0.1:${BOT_PORT:-8101}:8001']
    networks: [mama]
    restart: unless-stopped
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
networks:
  mama:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  medical_files:
